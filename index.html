<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#211d21">
  <title>Radio VI</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="scene" aria-hidden="true"><div class="scene-photo"></div><div class="scene-photo"></div></div>
  <main class="selector" aria-label="Selector de Radio VI">
    <div class="mode-control" id="mode-control" role="group" aria-label="Modo de escucha. Arrastra hacia abajo para On Demand">
      <button type="button" id="radio-mode" class="mode" aria-pressed="true">Radio</button>
      <button type="button" id="demand-mode" class="mode" aria-pressed="false">On Demand</button>
      <span class="mode-guide" aria-hidden="true"><span class="mode-thumb">↕</span></span>
    </div>

    <section class="station-selector" aria-label="Emisoras y programas">
      <div class="station-strip">
        <button type="button" id="previous" class="step" aria-label="Anterior"><span aria-hidden="true">‹</span></button>
        <div class="cards" id="cards" role="group" aria-label="Portadas"></div>
        <button type="button" id="next" class="step" aria-label="Siguiente"><span aria-hidden="true">›</span></button>
      </div>
      <div class="tuning">
        <button type="button" id="shoulder-left" class="shoulder" aria-label="L1, anterior">L1</button>
        <input type="range" id="dial" min="1" value="13" max="24" step="1" aria-label="Posición en el catálogo">
        <button type="button" id="shoulder-right" class="shoulder" aria-label="R1, siguiente">R1</button>
      </div>
      <div class="station-info" aria-live="polite" aria-atomic="true">
        <h1 id="station-name">Radio La Ola</h1>
        <p class="track" id="station-track"></p>
      </div>
    </section>

    <button class="power" id="power" type="button"><span class="cross" aria-hidden="true">×</span><span id="power-label">Apagar</span></button>
  </main>
</body>
</html>
