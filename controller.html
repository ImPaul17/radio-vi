<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#211d21">
  <meta name="radio-media-url" content="">
  <title>Mando · Radio VI</title>
  <link rel="stylesheet" href="controller.css">
  <script type="module" src="js/mobile-controller.js"></script>
</head>
<body>
  <main class="controller-surface" aria-label="Mando de Radio VI">
    <div class="controller-photo" aria-hidden="true"></div>
    <header class="controller-status">
      <p id="controller-status" role="status">Conectando con Radio VI…</p>
      <button id="controller-disconnect" type="button" hidden>Desconectar</button>
    </header>
    <div class="controller-deck" id="controller-controls" inert>
      <div class="shoulders shoulders-left" role="group" aria-label="Gatillos izquierdos">
        <button type="button" class="pad-button shoulder-button" data-button="6" aria-label="L2"><span class="pad-glyph" data-glyph="l2" aria-hidden="true"></span></button>
        <button type="button" class="pad-button shoulder-button" data-button="4" aria-label="L1"><span class="pad-glyph" data-glyph="l1" aria-hidden="true"></span></button>
      </div>
      <div class="shoulders shoulders-right" role="group" aria-label="Gatillos derechos">
        <button type="button" class="pad-button shoulder-button" data-button="7" aria-label="R2"><span class="pad-glyph" data-glyph="r2" aria-hidden="true"></span></button>
        <button type="button" class="pad-button shoulder-button" data-button="5" aria-label="R1"><span class="pad-glyph" data-glyph="r1" aria-hidden="true"></span></button>
      </div>
      <button type="button" class="pad-button select-button" data-button="8" aria-label="Select"><span class="pad-glyph" data-glyph="select" aria-hidden="true"></span></button>
      <div class="face-buttons" role="group" aria-label="Botones de acción">
        <button type="button" class="pad-button face-button triangle" data-button="3" aria-label="Triángulo"><span class="pad-glyph" data-glyph="triangle" aria-hidden="true"></span></button>
        <button type="button" class="pad-button face-button square" data-button="2" aria-label="Cuadrado"><span class="pad-glyph" data-glyph="square" aria-hidden="true"></span></button>
        <button type="button" class="pad-button face-button circle" data-button="1" aria-label="Círculo"><span class="pad-glyph" data-glyph="circle" aria-hidden="true"></span></button>
        <button type="button" class="pad-button face-button cross" data-button="0" aria-label="Cruz"><span class="pad-glyph" data-glyph="cross" aria-hidden="true"></span></button>
      </div>
      <div class="stick stick-left" tabindex="0" role="group" data-stick="0" aria-label="Joystick izquierdo, usa las flechas">
        <div class="stick-thumb"><span class="pad-glyph" data-glyph="l" aria-hidden="true"></span></div>
      </div>
      <div class="stick stick-right" tabindex="0" role="group" data-stick="1" aria-label="Joystick derecho, usa las flechas">
        <div class="stick-thumb"><span class="pad-glyph" data-glyph="r" aria-hidden="true"></span></div>
      </div>
    </div>
  </main>
</body>
</html>
